<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
</head>
<body> 
    <center>
    <h1 class="header"><b style="color: blue;">Get started from Facebook</b></h1> <br> <br>
    <p>Welcome to Facebook! <br> <br>create an account to connect with friends and family and communities of people who share your interests.</p> <br> <br>
    <h1><b>NAME</b></h1>
    <input type="text" id="name" name="name" placeholder="First Name"> <br> <br>
<input type="text" id="lname" name="lname" placeholder="Last Name" hover> <br> <br>
     <h1><b>DATE OF BIRTH</b></h1>
    <select name="day" id="day">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="26">26</option>
        <option value="27">27</option>
        <option value="28">28</option>
        <option value="29">29</option>
        <option value="30">30</option>
    </select>
     <select name="month" id="month">
        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>
        <option value="April">April</option>
        <option value="May">May</option>
        <option value="June">June</option>
        <option value="July">July</option>
        <option value="August">August</option>
        <option value="September">September</option>
        <option value="October">October</option>
        <option value="November">November</option>
        <option value="December">December</option>
    </select>
    <select name="year" id="year">
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
    </select> <br> <br> 
    <h1><b>Gender</b></h1>
    <select name="gender" id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>
    <h1><b style="color: black;">Email </b></h1>
    <label for="email">Email </label>
    <input type="email" id="email" name="email" placeholder="Enter your email"> <br> <br>
    <h3>you may recieve a notification from us. learn why we ask for your contact information</h3> <br> <br>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password"> <br> <br>
    <button type="submit" style="background-color: blue;width: 100px;height: 50px">SIGN UP</button>
    </center>
</body>
</html>
